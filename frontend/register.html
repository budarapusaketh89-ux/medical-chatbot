<!DOCTYPE html>
<html>
<head>
    <h1>MedQuery</h1>
<p style="text-align:center;margin-bottom:20px;color:#5C5952;">
    Create your account
</p>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-container">

    <h1>Create Account</h1>

    <input type="text"
           id="username"
           placeholder="Username">

    <input type="email"
           id="email"
           placeholder="Email">

    <input type="password"
           id="password"
           placeholder="Password">

    <button onclick="handleRegister()">
        Register
    </button>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script src="auth.js"></script>

<script>

async function handleRegister(){

    const username =
        document.getElementById("username").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const result =
        await registerUser(
            username,
            email,
            password
        );

    if(result.message){

        alert(
            "Registration successful!"
        );

        window.location.href =
            "login.html";

    } else {

        alert(
            result.detail ||
            "Registration failed"
        );

    }
}
</script>

</body>
</html>
